<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GENERATIONS — Practice on Your Own</title>
<meta property="og:title" content="GENERATIONS Practice Academy 🎓">
<meta property="og:description" content="Learn every GENERATIONS game on your own phone before game night. No host needed.">
<meta property="og:image" content="https://etothesmith.github.io/generations/assets/share_card.jpg">
<meta name="theme-color" content="#1A1B3A">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/blockparty.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
<style>
.learn { padding-bottom: 40px; }
.lr-top { display: flex; align-items: center; gap: 10px; padding: 4px 0 10px; }
.lr-top .ttl { font-family: var(--display); color: var(--gold); font-size: 18px; flex: 1; line-height: 1.05; }
.lr-top .pts { font-family: var(--display); color: var(--cream); background: rgba(0,0,0,.35); border: 2px solid var(--gold); border-radius: 12px; padding: 4px 10px; font-size: 15px; }
.lr-top button { background: rgba(255,255,255,.1); color: var(--cream); border: 2px solid rgba(255,255,255,.25); border-radius: 12px; font-weight: 900; padding: 6px 10px; }
.lr-prog { height: 8px; border-radius: 99px; background: rgba(255,255,255,.12); overflow: hidden; margin: 0 0 14px; }
.lr-prog i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), #7CF29A); }
.lr-hero { text-align: center; margin: 6px 0 14px; }
.lr-hero h1 { font-family: var(--display); font-weight: 400; color: var(--gold); font-size: clamp(30px, 9vw, 44px); line-height: .95; margin: 4px 0; }
.lr-hero p { margin: 6px 0; color: var(--cream); opacity: .9; }
.lr-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.lr-card { position: relative; text-align: left; background: rgba(20,22,60,.85); border: 2px solid rgba(255,255,255,.16); color: var(--cream); border-radius: 16px; padding: 10px 10px 9px; font-weight: 800; font-size: 14px; display: flex; gap: 8px; align-items: center; cursor: pointer; min-height: 58px; }
.lr-card .ic { font-size: 26px; flex: none; }
.lr-card small { display: block; font-weight: 600; opacity: .7; font-size: 11.5px; }
.lr-card.done { border-color: #7CF29A; }
.lr-card.done::after { content: '✓'; position: absolute; right: 8px; top: 6px; color: #7CF29A; font-weight: 900; }
.lr-sec { font-size: 12px; font-weight: 900; letter-spacing: .14em; color: var(--gold); text-transform: uppercase; margin: 14px 2px 6px; }
.coach { display: flex; gap: 10px; align-items: flex-start; background: #fff8e6; color: #241a3d; border-radius: 16px; padding: 10px 12px; margin: 10px 0; font-weight: 700; font-size: 15px; line-height: 1.3; box-shadow: 0 4px 0 rgba(0,0,0,.25); animation: coachIn .35s ease-out; }
.coach .cf { font-size: 26px; flex: none; }
.coach b { color: #b3261e; }
@keyframes coachIn { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
.how { background: rgba(0,0,0,.3); border: 2px solid rgba(255,255,255,.14); border-radius: 16px; padding: 12px 14px; margin: 10px 0; }
.how h3 { margin: 0 0 6px; font-family: var(--display); font-weight: 400; color: var(--gold); font-size: 15px; letter-spacing: .04em; }
.how ol { margin: 0; padding-left: 20px; }
.how li { margin: 4px 0; line-height: 1.3; }
.bots { display: flex; gap: 8px; justify-content: center; margin: 8px 0; }
.bot { text-align: center; font-size: 12px; font-weight: 800; width: 80px; }
.bot img { height: 64px; display: block; margin: 0 auto 2px; }
.bot .say { display: block; background: #fff; color: #222; border-radius: 10px; padding: 3px 5px; font-size: 11px; margin-top: 3px; min-height: 16px; }
.tally { margin: 8px 0; }
.tally .row { display: flex; align-items: center; gap: 8px; margin: 5px 0; font-weight: 800; }
.tally .bar { flex: 1; height: 22px; background: rgba(255,255,255,.1); border-radius: 8px; overflow: hidden; }
.tally .bar i { display: block; height: 100%; background: var(--gold); transition: width .6s; }
.tally .row.top .bar i { background: #7CF29A; }
.sv-board { display: grid; gap: 6px; margin: 10px 0; }
.sv-board div { display: flex; justify-content: space-between; background: #173a8f; border: 2px solid var(--gold); border-radius: 10px; padding: 9px 12px; font-weight: 800; }
.sv-board div.hid { color: transparent; background: #0d1d4d; }
.sv-board div.hid::before { content: attr(data-n); color: var(--gold); position: absolute; }
.sv-board div.miss { background: #0d1d4d; color: rgba(255,255,255,.55); }
.strikes { text-align: center; font-size: 30px; letter-spacing: 6px; min-height: 36px; }
.txt-in { width: 100%; font-size: 18px; padding: 12px 14px; border-radius: 12px; border: 3px solid var(--gold); background: #0b0c1f; color: var(--cream); margin: 6px 0; }
.diploma { background: linear-gradient(#fff8ec, #ffe9c7); color: #2b1446; border-radius: 22px; padding: 22px 18px; text-align: center; box-shadow: 0 0 0 6px var(--gold), 0 0 0 11px #2b1446; margin: 16px 6px; }
.diploma h2 { font-family: var(--display); font-weight: 400; font-size: 28px; margin: 6px 0; color: #2b1446; }
.diploma .nm { font-family: var(--display); font-size: 30px; color: #b3261e; margin: 6px 0; }
.lr-foot { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.lr-foot .btn { flex: 1 1 45%; }
.mini-q { font-weight: 800; font-size: 22px; text-align: center; margin: 16px 0; min-height: 60px; }
.blz { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.blz .opt { justify-content: center; font-size: 20px; }
.cardclue { background: var(--cream); color: var(--ink); border-radius: 18px; padding: 26px 14px; text-align: center; font-family: var(--display); font-size: 26px; margin: 12px 0; box-shadow: 0 6px 0 rgba(0,0,0,.3); }
.ans-list { display: grid; gap: 8px; margin: 8px 0; }
a.btn { text-decoration: none; display: flex; align-items: center; justify-content: center; text-align: center; }
.bot .say:empty { visibility: hidden; }
.ans-list .opt small { opacity: .65; margin-left: auto; }
</style>
</head>
<body>
<div class="stage-bg"><div class="floor"></div></div>
<div class="phone learn" id="app"></div>
<script type="module" src="js/learn.js"></script>
</body>
</html>
